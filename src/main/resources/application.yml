spring:
  application:
    name: vietsms-gateway
  profiles:
    active: dev
  datasource:
    # driver-class-name cố ý KHÔNG hardcode — Spring Boot tự suy từ JDBC URL.
    # H2 (jdbc:h2:...) cho dev/test, PostgreSQL (jdbc:postgresql:...) khi profile `postgres`.
    url: jdbc:h2:file:./data/vietsms;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080
  error:
    # never: không leak exception message/stack ra client ở mọi môi trường.
    # Lỗi nghiệp vụ 4xx vẫn trả message rõ qua GlobalExceptionHandler (ApiError).
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# vietsms.delivery.mode: scheduled (default) | kafka
# Leave unset (or set to 'scheduled') to use the polling DeliveryWorker.
# Set to 'kafka' to disable DeliveryWorker and drive delivery via Kafka topic.
vietsms:
  delivery:
    worker-interval-ms: 1000
    batch-size: 50
    success-rate: 0.95
    min-delay-ms: 1000
    max-delay-ms: 3000
    max-retries: 3
  ratelimit:
    # backend: memory | redis (default: memory)
    # Set to 'redis' for a distributed limiter when multiple app instances share one limit.
    sms-per-minute: 10
    otp-per-minute: 5
    otp-per-phone-cooldown-seconds: 30
  otp:
    default-length: 6
    default-ttl-seconds: 300
    max-attempts: 3
